name: conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  schema-conformance:
    name: Schema conformance (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - run: python -m pip install --upgrade pip jsonschema referencing
      - name: Validate schemas + fixtures
        run: python tests/conformance.py

  aep-corpus:
    name: AEP conformance corpus (manifest + structural + semantic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - run: python -m pip install --upgrade pip jsonschema
      - name: Execute corpus manifest checks
        run: python scripts/run-aep-conformance-corpus.py

  js-loader:
    name: JS loader smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: getSchema round-trips every registered id
        run: node --test

  consumer-version-bands:
    name: Consumer protocol version bands
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wasmagent-protocol
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: wasmagent-protocol
      - name: Checkout wasmagent-js
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: WasmAgent/wasmagent-js
          ref: main
          path: wasmagent-js
      - name: Checkout trace-pipeline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: WasmAgent/trace-pipeline
          ref: main
          path: trace-pipeline
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Verify consumer protocol dependency bands
        run: node wasmagent-protocol/scripts/check-consumer-versions.mjs wasmagent-js trace-pipeline

  python-loader:
    name: Python ${{ matrix.python-version }} wheel loader smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - name: Build wheel and import from it
        run: |
          python -m build --wheel
          python -m pip install dist/*.whl
          python -c "from wasmagent_protocol import get_schema, schema_ids; assert get_schema('aep-record')['title']=='AEPRecord'; print('ids:', schema_ids())"

  assurance-geometry:
    name: AEP assurance geometry (publication + external evidence + claim language)
    runs-on: ubuntu-latest
    steps:
      # Full history + tags: PC/EE checks resolve the publication tag, the
      # protected-main anchor, and the component protocol SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Verify certified target + trigger policy (CT-01..CT-08)
        run: |
          LATEST=$(ls conformance/aep/publications/*.publication.json | sort | tail -1)
          node scripts/verify-certified-target.mjs --target conformance/aep/certified-target.json --publication "$LATEST"
      - name: Verify ALL publication records (PC-01..PC-07, current + historical)
        run: |
          for rec in conformance/aep/publications/*.publication.json; do
            echo "--- $rec ---"
            node scripts/verify-publication-record.mjs --record "$rec"               --target conformance/aep/certified-target.json
          done
      - name: Verify certified publication anchors (PUB-01..07, every generation)
        run: |
          # Each publication generation is verified at ITS OWN anchor against
          # ITS OWN target manifest (generation self-consistency). Pending
          # anchors are skipped until their fast-follow resolution commit.
          for rec in conformance/aep/publications/*.publication.json; do
            TAG=$(python3 -c "import json,sys; print(json.load(open('$rec'))['publication']['tag'])")
            ANCHOR=$(python3 -c "import json,sys; d=json.load(open('$rec')); print(d['publication']['protected_main_commit'])")
            if [[ "$ANCHOR" == PENDING* ]]; then
              echo "skipping $TAG — anchor pending (fast-follow resolution)"
              continue
            fi
            node scripts/verify-certified-publication.mjs               --target conformance/aep/certified-target.json               --publication-ref "$TAG"               --target-ref "$TAG" \
              --allow-extra conformance/aep/publications/
          done
      - name: Assurance geometry negative regressions (R1/R2/R3/R12)
        run: node scripts/verify-assurance-negatives.mjs
      - name: Verify certified target + trigger policy (CT-01..CT-08)
        run: node scripts/verify-certified-target.mjs --target conformance/aep/certified-target.json --publication conformance/aep/publications/aep-certified-2026-09-13-03.publication.json
      - name: Verifier result contract invariants (R6–R10)
        run: node scripts/verify-assurance-invariants.mjs
      - name: Verify external evidence ledger (EE-01..EE-06)
        run: node scripts/verify-external-evidence.mjs --dir conformance/aep/external-evidence
      - name: Claim-language firewall
        run: node scripts/check-assurance-language.mjs
