name: release

# Publishes wasmagent-protocol to PyPI + npm via Trusted Publishing (OIDC).
#
# Release discipline:
# - Real publishes happen ONLY on a version tag `vX.Y.Z`.
# - A preflight job enforces tag == package.json version == pyproject.toml
#   version, so a tag can never publish a different version than it names.
# - workflow_dispatch runs are DRY-RUN only (build + verify, no publish).
# - npm publish depends on the Python build+smoke passing, so the two
#   distributions of the same version cannot drift apart.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build + verify only, no publish)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight (tag/version parity)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
      dry_run: ${{ steps.versions.outputs.dry_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Parse declared versions
        id: versions
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PY_VERSION=$(python3 - <<'PY'
          import re
          text = open("pyproject.toml", encoding="utf-8").read()
          print(re.search(r'^version\s*=\s*"([^"]+)"', text, re.M).group(1))
          PY
          )
          echo "package.json: ${PKG_VERSION}"
          echo "pyproject.toml: ${PY_VERSION}"
          if [ "$PKG_VERSION" != "$PY_VERSION" ]; then
            echo "::error::version mismatch: package.json (${PKG_VERSION}) != pyproject.toml (${PY_VERSION})"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            case "$TAG" in
              "v${PKG_VERSION}") ;;
              *) echo "::error::tag ${TAG} != v${PKG_VERSION} — refusing to publish"; exit 1 ;;
            esac
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch is dry-run only — real releases are tag-driven.
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build distributions
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Verify the built wheel is importable and schemas load
        run: |
          python -m pip install dist/*.whl
          python -c "from wasmagent_protocol import get_schema, schema_ids; assert get_schema('aep-record')['title']=='AEPRecord'; print('ids:', schema_ids())"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: [preflight, build]
    if: needs.preflight.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    # No `environment:` — the pending publisher was registered with an empty
    # environment, so this job must also run without one to match.
    permissions:
      id-token: write  # mandatory for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  npm-publish:
    name: Publish to npm (Trusted Publishing / OIDC)
    needs: [preflight, build]
    if: needs.preflight.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # mandatory for npm OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Per npm's official trusted-publishing example: setup-node@v6 + Node 24
      # (npm >= 11.5.1) + registry-url. v6 wires OIDC correctly; v4 does not and
      # rejects package-manager-cache. No NODE_AUTH_TOKEN — npm performs the OIDC
      # token exchange itself when id-token: write is granted.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Show npm version (must be >= 11.5.1 for OIDC)
        run: npm --version
      - name: Verify loader before publish
        run: node --test
      - name: Publish to npm (OIDC — no token, provenance auto-generated)
        run: npm publish --access public

  dry-run-summary:
    name: Dry run summary (no publish)
    needs: [preflight, build]
    if: needs.preflight.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "Dry run complete for version ${{ needs.preflight.outputs.version }}."
          echo "Real publishes are tag-driven: push a tag 'v${{ needs.preflight.outputs.version }}'."
