name: gate-c

# Gate C — exact-SHA four-repository conformance verdict matrix.
#
# Why: consumer-side `protocol@main` jobs are early drift detectors, but a
# green job sampled against an older protocol main is not conformance
# evidence for the current head. Gate C inverts the direction: the protocol
# repository owns the closure proof by checking out ITS OWN exact SHA plus
# the consumers' exact SHAs, running every consumer corpus adapter against
# THIS protocol checkout, and publishing a machine-readable attestation.
#
# The uploaded artifact (gate-c-attestation.json) is the canonical closure
# record: rerunning Gate C on the same four SHAs must produce the same
# verdict; upstream main movement never mutates an old attestation.

on:
  pull_request:
    paths:
      - 'conformance/**'
      - 'schemas/**'
      - 'scripts/run-aep-conformance-corpus.py'
      - '.github/workflows/gate-c.yml'
  push:
    branches: [main]
    paths:
      - 'conformance/**'
      - 'schemas/**'
      - 'scripts/run-aep-conformance-corpus.py'
      - '.github/workflows/gate-c.yml'
  workflow_dispatch:

jobs:
  verdict-matrix:
    name: Gate C — exact-SHA consumer verdict matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wasmagent-protocol (candidate SHA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Record exact consumer SHAs
        id: shas
        run: |
          PROTOCOL_SHA=$(git rev-parse HEAD)
          echo "protocol=$PROTOCOL_SHA" >> "$GITHUB_OUTPUT"

          git clone --depth 1 https://github.com/WasmAgent/wasmagent-js.git ../wasmagent-js
          echo "js=$(git -C ../wasmagent-js rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          git clone --depth 1 https://github.com/WasmAgent/wasmagent-proxy.git ../wasmagent-proxy
          echo "proxy=$(git -C ../wasmagent-proxy rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          git clone --depth 1 https://github.com/WasmAgent/trace-pipeline.git ../trace-pipeline
          echo "trace=$(git -C ../trace-pipeline rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ---- JS consumer adapter ------------------------------------------------
      - name: Setup Bun (JS adapter)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: JS corpus adapter (authenticity + chain)
        id: adapter-js
        continue-on-error: true
        working-directory: ../wasmagent-js
        run: |
          bun install
          bun scripts/verify-corpus.mjs "${{ github.workspace }}/conformance/aep"

      # ---- Rust consumer adapter ---------------------------------------------
      - name: Setup Rust (Rust adapter)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - name: Rust corpus adapter (authenticity + chain)
        id: adapter-rust
        continue-on-error: true
        working-directory: ../wasmagent-proxy
        env:
          AEP_PROTOCOL_CORPUS: ${{ github.workspace }}/conformance/aep
        run: cargo test -p aep-core --test protocol_corpus

      # ---- Trace (Python) consumer adapter ------------------------------------
      - name: Setup Python (Trace adapter)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Trace corpus adapter (structural + semantic + authenticity + chain)
        id: adapter-trace
        continue-on-error: true
        working-directory: ../trace-pipeline
        env:
          AEP_PROTOCOL_CORPUS: ${{ github.workspace }}/conformance/aep
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          PYTHONPATH=. pytest tests/test_conformance_corpus.py -q

      # ---- Attestation --------------------------------------------------------
      - name: Emit gate-c attestation artifact
        id: attest
        if: always()
        env:
          SHA_PROTOCOL: ${{ steps.shas.outputs.protocol }}
          SHA_JS: ${{ steps.shas.outputs.js }}
          SHA_PROXY: ${{ steps.shas.outputs.proxy }}
          SHA_TRACE: ${{ steps.shas.outputs.trace }}
          OUTCOME_JS: ${{ steps.adapter-js.outcome }}
          OUTCOME_RUST: ${{ steps.adapter-rust.outcome }}
          OUTCOME_TRACE: ${{ steps.adapter-trace.outcome }}
        run: |
          python - << 'PY'
          import json, os

          def verdict(outcome):
              if outcome == "success":
                  return "pass"
              if outcome in ("failure", "cancelled", "timed_out"):
                  return "fail"
              return "not-executed"

          shas = {
              "protocol": os.environ["SHA_PROTOCOL"],
              "js": os.environ["SHA_JS"],
              "proxy": os.environ["SHA_PROXY"],
              "trace": os.environ["SHA_TRACE"],
          }
          verdicts = {
              "js_authenticity_and_chain": verdict(os.environ["OUTCOME_JS"]),
              "rust_authenticity_and_chain": verdict(os.environ["OUTCOME_RUST"]),
              "trace_structural_semantic_authenticity_chain": verdict(os.environ["OUTCOME_TRACE"]),
          }
          manifest = json.load(open("conformance/aep/manifest.json"))
          attestation = {
              **shas,
              "signing_profile_id": manifest["signing_profile_id"],
              "verdicts": verdicts,
              "verdict": "pass" if all(v == "pass" for v in verdicts.values()) else "fail",
          }
          with open("gate-c-attestation.json", "w") as f:
              json.dump(attestation, f, indent=2)
          print(json.dumps(attestation, indent=2))
          if attestation["verdict"] != "pass":
              with open(os.environ["GITHUB_OUTPUT"], "a") as g:
                  g.write("failed=1\n")
          PY

      - name: Fail the gate when any adapter failed
        if: steps.attest.outputs.failed == '1'
        run: |
          echo "Gate C verdict: FAIL — see gate-c-attestation.json"
          exit 1

      - name: Upload attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-c-attestation
          path: gate-c-attestation.json
