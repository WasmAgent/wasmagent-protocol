name: schema-parity

# Cross-repository contract gates.
# Runs on every PR to main in wasmagent-protocol.
# Checks out wasmagent-js and trace-pipeline at their latest main.
#
# Gate A (check-schema-parity.py): version / $id reference sanity.
#   Fails if a downstream consumer:
#     - uses a schema_version value not listed in the canonical enum
#     - has a local .schema.json that re-declares a canonical $id
#
# Gate B (check-aep-contract-compatibility.py): structural compatibility.
#   Compares consumer schema exports against the canonical schema
#   (properties, required, enums, types, additionalProperties).
#   Currently REPORT-ONLY: it prints the drift inventory so every item can
#   be classified as bug / intentional extension / compatibility exception.
#   Once the baseline is allowlisted, flip the job to --strict so new
#   drift fails CI.

on:
  pull_request:
    paths:
      - 'schemas/**'
      - 'scripts/check-aep-contract-compatibility.py'
      - 'scripts/check-schema-parity.py'
      - 'scripts/aep-contract-exceptions.json'
      - '.github/workflows/schema-parity.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/**'
      - 'scripts/check-aep-contract-compatibility.py'
      - 'scripts/check-schema-parity.py'
      - 'scripts/aep-contract-exceptions.json'
      - '.github/workflows/schema-parity.yml'
  workflow_dispatch:

jobs:
  parity:
    name: Gate A — version/$id references (wasmagent-js + trace-pipeline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wasmagent-protocol
        uses: actions/checkout@v4
        with:
          path: wasmagent-protocol

      - name: Checkout wasmagent-js
        uses: actions/checkout@v4
        with:
          repository: WasmAgent/wasmagent-js
          ref: main
          path: wasmagent-js

      - name: Checkout trace-pipeline
        uses: actions/checkout@v4
        with:
          repository: WasmAgent/trace-pipeline
          ref: main
          path: trace-pipeline

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install jsonschema
        run: python -m pip install --upgrade pip jsonschema

      - name: Run parity check
        run: python wasmagent-protocol/scripts/check-schema-parity.py

  contract-compatibility:
    name: Gate B — structural contract compatibility (report-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wasmagent-protocol
        uses: actions/checkout@v4
        with:
          path: wasmagent-protocol

      - name: Checkout wasmagent-js
        uses: actions/checkout@v4
        with:
          repository: WasmAgent/wasmagent-js
          ref: main
          path: wasmagent-js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # --strict with the classified exception allowlist
      # (scripts/aep-contract-exceptions.json): every baseline drift is
      # classified, so any NEW structural drift fails this gate.
      - name: Structural contract comparison (strict)
        working-directory: wasmagent-protocol
        run: python scripts/check-aep-contract-compatibility.py --strict --consumer wasmagent-js=../wasmagent-js/packages/aep/schemas/aep-record.schema.json

      - name: Gate B self-test (mutation detection)
        working-directory: wasmagent-protocol
        run: python scripts/check-aep-contract-compatibility.py --self-test
